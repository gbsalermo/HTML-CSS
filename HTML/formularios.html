<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <style>
        label{
            cursor: pointer; /*Muda o cursor para um ponteiro quando o usuário passa o mouse sobre o rótulo, indicando que é clicável.*/
            display: block; /*Exibe o rótulo como um bloco, ocupando toda a largura disponível e iniciando em uma nova linha. */
           
        }
  
        .checkbox label{
            cursor: pointer; /*Muda o cursor para um ponteiro quando o usuário passa o mouse sobre o rótulo, indicando que é clicável.*/
            display: inline; 
        }
    



    </style>
    <form action="#" method="get" target="_blank"
    autocomplete="off">
        <p>O formulario</p>
            <p>
                <label for = "nome"><!--A tag label é usada para associar um rótulo a um elemento de formulário, como um campo de entrada. O atributo for é usado para associar o rótulo a um elemento específico, usando o valor do atributo id do elemento de formulário correspondente.-->
                 Nome:</label>
                <input type="text" id="nome"
                name="nome" placeholder="Seu nome" required>   
                
            </p>
             <p class="checkbox">
                <label for = "dev"><!--A tag label é usada para associar um rótulo a um elemento de formulário, como um campo de entrada. O atributo for é usado para associar o rótulo a um elemento específico, usando o valor do atributo id do elemento de formulário correspondente.-->
                 Sou um dev</label>
                <input type="checkbox" id="dev" name="dev"
                value="sim"  required>
                <!--checked deixa ele marcado inicialmente--> 
                 <!--required informa que tem de ser preenchido obrigatoriamente-->  
            </p>
             <p 
             class="checkbox">
             Genero:<br>
                <label for = "feminino"><!--A tag label é usada para associar um rótulo a um elemento de formulário, como um campo de entrada. O atributo for é usado para associar o rótulo a um elemento específico, usando o valor do atributo id do elemento de formulário correspondente.-->
                 Ferminino</label>
                <input type="radio" id="feminino" name="genero"
                value="feminino"  required><br>
                <label for = "masculino"> Masculino</label>
                <input type="radio" id="masculino" name="genero"
                value="masculino"  required><br>
                <label for = "outro"> Outro</label>
                <input type="radio" id="outro" name="genero"
                value="outro"  required>
             </p>

             <p>
                <label for="nome">Date:</label>
                <input type="date" id="nome" name="nome"
                placeholder="dd/mm/aaaa" required>
             </p>
            <p>
                <label for="email">Seu Email:</label>
                <input type="email" id="email" name="email"
                placeholder="ex.: email@email.com" required>
             </p>
            <p>
                <label for="file">Sua foto:</label>
                <input type="file" id="file" name="file" 
                accept=".png, .svg, images/*" multiple>
             </p>
             <p>
                <label for="number">Number:</label>
                <input type="number" id="number" name="number" 
                min="10" max="50" step="5">
             </p>

            <p>
                <button type="reset">Reset</button>
                <button type="submit">Enviar</button>
            </p>
            <p>
                <label for="password">Sua senha:</label>
                <input type="password" id="password" name="password" 
                placeholder="Digite sua senha"
                minlength="8" maxlength="12">
             </p>
            <p>
                <label for="range">range:</label>
                <input type="range" id="range" name="range" 
                min="0" max="10" step="2">
             </p>

             <datalist>
                <option value="0" label="0%"></option>
                <option value="2" label="20%"></option> 
                <option value="4" label="40%"></option>
                <option value="6" label="60%"></option>
                <option value="8" label="80%"></option>
                <option value="10" label="100%"></option>
             </datalist>
             <p>
                <label for="url">Sua url:</label>
                <input type="url" id="url" name="url" 
                placeholder="ex.: https://www.exemplo.com">
             </p>
             <p>
                <label for="search">range:</label>
                <input type="search" id="search" name="search" 
                placeholder="Digite sua pesquisa">
             </p>
                <p>
                <label for="select">Selecione uma opção:</label>
                <select name="opcoes" id="select">
                    <option value="opcao1">Opção 1</option>
                    <option value="opcao2">Opção 2</option>
                    <option value="opcao3">Opção 3</option>
                </select>
             </p>
             <p>
                <label for="textarea">comentario</label>
                <textarea id="textarea" 
                name="comentario" rows="10" cols="50"></textarea>
             </p>
   </form>

</body>
</html>
